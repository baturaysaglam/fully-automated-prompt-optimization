[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus"
version = "0.1.0"
description = "A prompt-evaluation framework for security tasks"
license = {text = "Apache-2.0"}
authors = [{name = "Paul Kassianik"}]
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "pytest>=7.0",
  "datasets>=2.0",
  "langgraph>=0.2",
  "requests>=2.28",
]

[project.optional-dependencies]
local-models = ["llama-cpp-python", "huggingface_hub"]
hotpotqa = ["bm25s==0.2.14", "PyStemmer>=2.0", "ujson>=5.0", "diskcache>=5.0"]
hover = ["bm25s>=0.2", "PyStemmer>=2.0", "ujson>=5.0", "diskcache>=5.0"]
ifbench = ["nltk>=3.8", "spacy>=3.0", "emoji>=2.0", "syllapy>=0.7", "immutabledict>=4.0", "langdetect>=1.0", "packaging>=21.0"]
livebench_math = ["sympy>=1.12", "lark>=1.1", "Levenshtein>=0.20"]
papillon = []
cti_rcm = ["cisco-foundation-ai-test-harness @ git+https://github.com/cisco-foundation-ai/faith.git@0.2.0"]

[project.urls]
Repository = "https://github.com/cisco-foundation-ai/fully-automated-prompt-optimization"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: end-to-end smoke tests requiring live API keys and GCS access",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["hephaestus", "src"]

[tool.setuptools.packages.find]
include = ["hephaestus*", "src*"]
